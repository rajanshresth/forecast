[project]
name = "admissions-forecast-backend"
version = "0.1.0"
description = "FastAPI backend for admissions forecasting (Poisson GLM, Holt-Winters, OLS)"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110,<1.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "statsmodels>=0.14",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.uv]
package = false